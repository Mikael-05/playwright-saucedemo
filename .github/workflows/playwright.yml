name: Playwright Tests

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de tests à exécuter'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - smoke-sanity
          - smoke-sanity-regression

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Testiny CLI
      run: npm install --no-save @testiny/cli@latest

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Détermine la suite à exécuter
    - name: Define test suite
      id: test_suite
      run: |
        if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "suite=smoke" >> "$GITHUB_OUTPUT"
        else
          echo "suite=${{ inputs.test_suite }}" >> "$GITHUB_OUTPUT"
        fi

    # Lance les tests
    - name: Run Playwright tests
      run: |
        if [ "${{ steps.test_suite.outputs.suite }}" = "smoke" ]; then
          npx playwright test --grep "@smoke"

        elif [ "${{ steps.test_suite.outputs.suite }}" = "smoke-sanity" ]; then
          npx playwright test --grep "@smoke|@sanity"

        elif [ "${{ steps.test_suite.outputs.suite }}" = "smoke-sanity-regression" ]; then
          npx playwright test --grep "@smoke|@sanity|@regression"
        fi

    # Envoie les résultats à Testiny
    - name: Upload results to Testiny
      if: ${{ !cancelled() }}
      env:
        TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
      run: |
        npx @testiny/cli automation \
          --project 1 \
          --source "${{ steps.test_suite.outputs.suite }}" \
          --playwright results/results.json

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
